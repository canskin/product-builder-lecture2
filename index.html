<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천기</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #4169E1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 650px;
      padding: 40px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 10px;
      color: #333;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    .lotto-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
    }

    .numbers {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      background: #f7f7f7;
    }

    .set-title {
      width: 100%;
      font-size: 14px;
      font-weight: bold;
      color: #777;
      margin-bottom: 4px;
    }

    .ball {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ff9800;
      color: white;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button {
      border: none;
      background: #ff5722;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #e64a19;
      transform: scale(1.05);
    }

    .notice {
      margin-top: 25px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>로또 번호 추천기</h1>
    <p>버튼을 누르면 1부터 45까지의 숫자 중 6개 번호를 5세트 추천합니다.</p>

    <div class="lotto-list" id="lottoList">
      <div class="numbers">
        <div class="set-title">1번 추천번호</div>
        <div class="ball">?</div>
        <div class="ball">?</div>
        <div class="ball">?</div>
        <div class="ball">?</div>
        <div class="ball">?</div>
        <div class="ball">?</div>
      </div>
    </div>

    <button onclick="generateFiveLotto()">로또 번호 5개 추천받기</button>

    <div class="notice">
      재미용 번호 추천입니다. 실제 당첨을 보장하지 않습니다.
    </div>
  </div>

  <script>
    function generateOneLotto() {
      const lottoNumbers = [];

      while (lottoNumbers.length < 6) {
        const number = Math.floor(Math.random() * 45) + 1;

        if (!lottoNumbers.includes(number)) {
          lottoNumbers.push(number);
        }
      }

      lottoNumbers.sort((a, b) => a - b);

      return lottoNumbers;
    }

    function getBallColor(number) {
      if (number <= 10) {
        return "#fbc400";
      } else if (number <= 20) {
        return "#69c8f2";
      } else if (number <= 30) {
        return "#ff7272";
      } else if (number <= 40) {
        return "#aaa";
      } else {
        return "#b0d840";
      }
    }

    function generateFiveLotto() {
      const lottoList = document.getElementById("lottoList");
      lottoList.innerHTML = "";

      for (let i = 1; i <= 5; i++) {
        const lottoNumbers = generateOneLotto();

        const numberBox = document.createElement("div");
        numberBox.className = "numbers";

        const title = document.createElement("div");
        title.className = "set-title";
        title.textContent = i + "번 추천번호";
        numberBox.appendChild(title);

        lottoNumbers.forEach(number => {
          const ball = document.createElement("div");
          ball.className = "ball";
          ball.textContent = number;
          ball.style.background = getBallColor(number);

          numberBox.appendChild(ball);
        });

        lottoList.appendChild(numberBox);
      }
    }
  </script>
</body>
</html>
